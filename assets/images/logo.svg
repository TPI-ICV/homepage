<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <linearGradient id="grad-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background shield / hex base -->
  <polygon points="250,30 430,130 430,370 250,470 70,370 70,130" 
           fill="#0F172A" stroke="url(#grad-primary)" stroke-width="6" stroke-linejoin="round" />
  
  <polygon points="250,55 405,145 405,355 250,445 95,355 95,145" 
           fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="6,6" />

  <!-- Radar / Perception Arcs -->
  <path d="M 130 200 A 130 130 0 0 1 370 200" fill="none" stroke="url(#grad-glow)" stroke-width="3" stroke-linecap="round" />
  <path d="M 160 220 A 100 100 0 0 1 340 220" fill="none" stroke="url(#grad-primary)" stroke-width="4" stroke-linecap="round" />
  <path d="M 190 240 A 65 65 0 0 1 310 240" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.9" />

  <!-- Neural Net AI Nodes & Autonomous Vehicle Silhouette -->
  <!-- Connected nodes -->
  <line x1="250" y1="120" x2="180" y2="180" stroke="#38BDF8" stroke-width="2.5" opacity="0.7"/>
  <line x1="250" y1="120" x2="320" y2="180" stroke="#38BDF8" stroke-width="2.5" opacity="0.7"/>
  <line x1="180" y1="180" x2="250" y2="230" stroke="#38BDF8" stroke-width="2.5" opacity="0.8"/>
  <line x1="320" y1="180" x2="250" y2="230" stroke="#38BDF8" stroke-width="2.5" opacity="0.8"/>
  
  <circle cx="250" cy="120" r="10" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="180" cy="180" r="8" fill="#0284C7" />
  <circle cx="320" cy="180" r="8" fill="#0284C7" />
  <circle cx="250" cy="230" r="12" fill="#60A5FA" filter="url(#glow)" />

  <!-- Intelligent Vehicle Dynamic Silhouette -->
  <g transform="translate(140, 260) scale(0.72)">
    <!-- Chassis / Car aerodynamic curve -->
    <path d="M 20 80 Q 40 40 100 35 L 180 30 Q 240 30 270 70 L 290 85 Q 300 95 285 100 L 15 100 Q 5 95 20 80 Z" 
          fill="url(#grad-primary)" />
    <!-- Cabin Glass / Cockpit -->
    <path d="M 100 40 L 175 35 Q 215 35 240 70 L 120 70 Z" 
          fill="#0F172A" opacity="0.85" stroke="#38BDF8" stroke-width="1.5" />
    <!-- Headlight beam -->
    <polygon points="280,80 340,65 340,95" fill="url(#grad-accent)" opacity="0.85" filter="url(#glow)" />
    <!-- Wheels -->
    <circle cx="70" cy="100" r="22" fill="#0F172A" stroke="#38BDF8" stroke-width="4" />
    <circle cx="70" cy="100" r="8" fill="#38BDF8" />
    <circle cx="230" cy="100" r="22" fill="#0F172A" stroke="#38BDF8" stroke-width="4" />
    <circle cx="230" cy="100" r="8" fill="#38BDF8" />
  </g>

  <!-- Typography / Symbol -->
  <text x="250" y="390" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" letter-spacing="3">
    TPI-ICV
  </text>
  <text x="250" y="420" text-anchor="middle" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="18" letter-spacing="4">
    2026
  </text>
</svg>
